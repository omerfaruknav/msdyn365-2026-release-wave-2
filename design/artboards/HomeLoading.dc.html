<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1024px; height: 768px">
<dc-import name="Main" theme="dark" viewport="1024" ui-state="loading" hint-size="1024px,768px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
